# Server
server.port=${SERVER_PORT:8080}

# Database: provided by DataSourceConfig from DB_URL / DATABASE_URL environment variables.
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-key-in-production-min-256-bits-long-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin seed
app.admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:Administrator}

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.ecommerce=INFO
