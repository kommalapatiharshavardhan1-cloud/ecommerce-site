<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-bag-heart"></i> ShopEase</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" id="nav-cart" href="/cart.html">Cart</a></li>
        <li class="nav-item"><a class="nav-link d-none" id="nav-admin" href="/admin.html">Admin</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><span class="nav-link d-none" id="nav-user"></span></li>
        <li class="nav-item"><a class="nav-link" id="nav-login" href="/login.html">Login</a></li>
        <li class="nav-item"><button class="btn btn-sm btn-outline-light ms-2 d-none" id="nav-logout">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container my-4">
  <div class="row g-3 align-items-end mb-4">
    <div class="col-md-5">
      <label class="form-label small">Search</label>
      <input type="text" id="q" class="form-control" placeholder="Search products...">
    </div>
    <div class="col-md-4">
      <label class="form-label small">Category</label>
      <select id="cat" class="form-select"><option value="">All categories</option></select>
    </div>
    <div class="col-md-3 d-grid">
      <button class="btn btn-primary" id="search-btn"><i class="bi bi-search"></i> Search</button>
    </div>
  </div>
  <div id="grid" class="row g-4"></div>
  <nav class="mt-4"><ul class="pagination justify-content-center" id="pager"></ul></nav>
</div>
<footer class="footer"><div class="container text-center"><p class="mb-0">&copy; 2025 ShopEase.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let page = 0;
const size = 12;
async function loadCategories() {
  const cats = await api.get('/api/categories');
  const sel = document.getElementById('cat');
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name; sel.appendChild(o);
  });
}
function productCard(p) {
  return `
  <div class="col-md-3 col-sm-6">
    <div class="card h-100">
      <img src="${p.imageUrl || '/images/product-placeholder.svg'}" class="product-img" alt="${p.name}" onerror="this.src='/images/product-placeholder.svg'">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">${p.name}</h5>
        <p class="card-text text-muted small flex-grow-1">${(p.description||'').slice(0,70)}</p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="price">${money(p.price)}</span>
          <span class="small text-muted">Stock: ${p.stock}</span>
        </div>
        <div class="mt-2 d-flex gap-2">
          <a href="/product-details.html?id=${p.id}" class="btn btn-sm btn-outline-primary flex-grow-1">Details</a>
          <button class="btn btn-sm btn-primary add-to-cart" data-id="${p.id}"><i class="bi bi-cart-plus"></i></button>
        </div>
      </div>
    </div>
  </div>`;
}
async function load() {
  const q = document.getElementById('q').value;
  const cat = document.getElementById('cat').value;
  let url = `/api/products?page=${page}&size=${size}`;
  if (q) url += `&q=${encodeURIComponent(q)}`;
  if (cat) url += `&categoryId=${cat}`;
  const data = await api.get(url);
  document.getElementById('grid').innerHTML = (data.content||[]).map(productCard).join('') || '<p class="text-muted">No products found.</p>';
  bindAdd();
  renderPager(data);
}
function bindAdd() {
  document.querySelectorAll('.add-to-cart').forEach(b => {
    b.onclick = async () => {
      if (!getToken()) { window.location.href='/login.html'; return; }
      try { await api.post('/api/cart/items', { productId:+b.dataset.id, quantity:1 }); showToast('Added to cart'); }
      catch(e){ showToast(e.message,'error'); }
    };
  });
}
function renderPager(data) {
  const ul = document.getElementById('pager');
  const totalPages = data.totalPages || 1;
  let html = '';
  for (let i=0;i<totalPages;i++) {
    html += `<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" data-p="${i}">${i+1}</a></li>`;
  }
  ul.innerHTML = html;
  ul.querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); page=+a.dataset.p; load(); });
}
document.getElementById('search-btn').onclick = () => { page=0; load(); };
const params = new URLSearchParams(location.search);
if (params.get('q')) document.getElementById('q').value = params.get('q');
if (params.get('categoryId')) {}
loadCategories().then(() => {
  if (params.get('categoryId')) document.getElementById('cat').value = params.get('categoryId');
  load();
});
</script>
</body>
</html>
