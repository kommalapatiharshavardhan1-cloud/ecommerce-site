<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-bag-heart"></i> ShopEase</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" id="nav-cart" href="/cart.html">Cart</a></li>
        <li class="nav-item"><a class="nav-link d-none" id="nav-admin" href="/admin.html">Admin</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><span class="nav-link d-none" id="nav-user"></span></li>
        <li class="nav-item"><a class="nav-link" id="nav-login" href="/login.html">Login</a></li>
        <li class="nav-item"><button class="btn btn-sm btn-outline-light ms-2 d-none" id="nav-logout">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="container text-center">
    <h1 class="display-4 mb-3">Welcome to ShopEase</h1>
    <p class="lead mb-4">Discover premium products at unbeatable prices</p>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="input-group input-group-lg shadow">
          <input type="text" id="hero-search" class="form-control" placeholder="Search products...">
          <button class="btn btn-warning" id="hero-search-btn"><i class="bi bi-search"></i></button>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="container my-5">
  <h2 class="mb-3">Shop by Category</h2>
  <div class="row g-3" id="categories"></div>
</div>

<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Featured Products</h2>
    <a href="/products.html" class="btn btn-outline-primary">View All</a>
  </div>
  <div class="row g-4" id="featured"></div>
</div>

<footer class="footer">
  <div class="container text-center">
    <p class="mb-0">&copy; 2025 ShopEase. Secure checkout &amp; fast delivery.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function loadCategories() {
  try {
    const cats = await api.get('/api/categories');
    document.getElementById('categories').innerHTML = cats.map(c => `
      <div class="col-md-3 col-6">
        <a href="/products.html?categoryId=${c.id}" class="text-decoration-none">
          <div class="card p-3 text-center h-100">
            <i class="bi bi-grid fs-1 text-primary"></i>
            <h5 class="mt-2 text-dark">${c.name}</h5>
          </div>
        </a>
      </div>`).join('');
  } catch(e) { console.error(e); }
}
async function loadFeatured() {
  try {
    const data = await api.get('/api/products?featured=true&page=0&size=8');
    // featured param not supported by search; fetch all and filter
  } catch(e){}
  try {
    const data = await api.get('/api/products?page=0&size=8');
    const items = (data.content || []).filter(p => p.featured).slice(0,8);
    const list = items.length ? items : (data.content || []).slice(0,8);
    document.getElementById('featured').innerHTML = list.map(productCard).join('');
    bindCartButtons();
  } catch(e) { console.error(e); }
}
function productCard(p) {
  return `
  <div class="col-md-3 col-sm-6">
    <div class="card h-100">
      <img src="${p.imageUrl || '/images/product-placeholder.svg'}" class="product-img" alt="${p.name}" onerror="this.src='/images/product-placeholder.svg'">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">${p.name}</h5>
        <div class="small text-warning mb-1">${p.rating ? ('★' + p.rating.toFixed(1) + ' (' + (p.reviewCount||0) + ')' ) : 'New'}</div>
        <p class="card-text text-muted small flex-grow-1">${(p.description||'').slice(0,70)}</p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="price">${money(p.price)}</span>
          <button class="btn btn-sm btn-primary add-to-cart" data-id="${p.id}"><i class="bi bi-cart-plus"></i></button>
        </div>
      </div>
    </div>
  </div>`;
}
function bindCartButtons() {
  document.querySelectorAll('.add-to-cart').forEach(b => {
    b.onclick = async () => {
      if (!getToken()) { window.location.href='/login.html'; return; }
      try {
        await api.post('/api/cart/items', { productId: +b.dataset.id, quantity: 1 });
        showToast('Added to cart');
      } catch(e) { showToast(e.message, 'error'); }
    };
  });
}
document.getElementById('hero-search-btn').onclick = () => {
  const q = document.getElementById('hero-search').value;
  window.location.href = '/products.html?q=' + encodeURIComponent(q);
};
document.getElementById('hero-search').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('hero-search-btn').click(); });
loadCategories();
loadFeatured();
</script>
</body>
</html>
