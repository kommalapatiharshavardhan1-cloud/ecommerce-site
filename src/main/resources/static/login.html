<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-bag-heart"></i> ShopEase</a>
  </div>
</nav>
<div class="container my-5" style="max-width:420px">
  <div class="card p-4">
    <h3 class="mb-3 text-center">Login</h3>
    <form id="form">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
      <p class="text-center mt-3 mb-0">No account? <a href="/register.html">Register</a></p>
    </form>
  </div>
</div>
<footer class="footer"><div class="container text-center"><p class="mb-0">&copy; 2025 ShopEase.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const res = await api.post('/api/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    setSession(res.token, { id: res.userId, fullName: res.fullName, email: res.email, role: res.role });
    showToast('Welcome back!');
    setTimeout(() => window.location.href = res.role === 'ADMIN' ? '/admin.html' : '/index.html', 600);
  } catch(err) { showToast(err.message, 'error'); }
};
</script>
</body>
</html>
