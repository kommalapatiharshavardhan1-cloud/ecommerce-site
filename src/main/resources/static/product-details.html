<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-bag-heart"></i> ShopEase</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" id="nav-cart" href="/cart.html">Cart</a></li>
        <li class="nav-item"><a class="nav-link d-none" id="nav-admin" href="/admin.html">Admin</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><span class="nav-link d-none" id="nav-user"></span></li>
        <li class="nav-item"><a class="nav-link" id="nav-login" href="/login.html">Login</a></li>
        <li class="nav-item"><button class="btn btn-sm btn-outline-light ms-2 d-none" id="nav-logout">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container my-5">
  <div id="detail" class="row g-4 align-items-center"></div>
</div>
<footer class="footer"><div class="container text-center"><p class="mb-0">&copy; 2025 ShopEase.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
async function load() {
  const p = await api.get('/api/products/' + id);
  document.getElementById('detail').innerHTML = `
    <div class="col-md-6">
      <img src="${p.imageUrl || '/images/product-placeholder.svg'}" class="img-fluid rounded shadow" alt="${p.name}" onerror="this.src='/images/product-placeholder.svg'">
    </div>
    <div class="col-md-6">
      <span class="badge text-bg-secondary mb-2">${p.categoryName || 'Uncategorized'}</span>
      <h2>${p.name}</h2>
      <p class="text-muted">${p.description || ''}</p>
      <div class="price fs-2 mb-3">${money(p.price)}</div>
      <p><strong>Stock:</strong> ${p.stock} available</p>
      <div class="d-flex align-items-center gap-2 mb-3">
        <input type="number" id="qty" class="form-control" style="width:90px" min="1" value="1" max="${p.stock}">
        <button class="btn btn-primary" id="add-btn"><i class="bi bi-cart-plus"></i> Add to Cart</button>
      </div>
    </div>`;
  document.getElementById('add-btn').onclick = async () => {
    if (!getToken()) { window.location.href='/login.html'; return; }
    const q = +document.getElementById('qty').value;
    try { await api.post('/api/cart/items', { productId: p.id, quantity: q }); showToast('Added to cart'); }
    catch(e){ showToast(e.message,'error'); }
  };
}
load().catch(e => { document.getElementById('detail').innerHTML = '<p class="text-danger">Product not found.</p>'; });
</script>
</body>
</html>
