<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-bag-heart"></i> ShopEase</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" id="nav-cart" href="/cart.html">Cart</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><span class="nav-link d-none" id="nav-user"></span></li>
        <li class="nav-item"><a class="nav-link" id="nav-login" href="/login.html">Login</a></li>
        <li class="nav-item"><button class="btn btn-sm btn-outline-light ms-2 d-none" id="nav-logout">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container my-4" style="max-width:600px">
  <h2>Checkout</h2>
  <form id="form" class="card p-4">
    <div class="mb-3">
      <label class="form-label">Shipping Address</label>
      <textarea id="address" class="form-control" rows="3" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" id="phone" class="form-control" required>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-success flex-grow-1" type="submit">Place Order</button>
      <a href="/cart.html" class="btn btn-outline-secondary">Back to Cart</a>
    </div>
  </form>
</div>
<footer class="footer"><div class="container text-center"><p class="mb-0">&copy; 2025 ShopEase.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
if (!requireAuth()) {}
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const order = await api.post('/api/orders/checkout', {
      shippingAddress: document.getElementById('address').value,
      phone: document.getElementById('phone').value
    });
    showToast('Order placed successfully!');
    setTimeout(() => window.location.href = '/orders.html', 800);
  } catch(err) { showToast(err.message,'error'); }
};
</script>
</body>
</html>
