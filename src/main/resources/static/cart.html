<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-bag-heart"></i> ShopEase</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" id="nav-cart" href="/cart.html">Cart</a></li>
        <li class="nav-item"><a class="nav-link d-none" id="nav-admin" href="/admin.html">Admin</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><span class="nav-link d-none" id="nav-user"></span></li>
        <li class="nav-item"><a class="nav-link" id="nav-login" href="/login.html">Login</a></li>
        <li class="nav-item"><button class="btn btn-sm btn-outline-light ms-2 d-none" id="nav-logout">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container my-4">
  <h2>Your Cart</h2>
  <div id="cart" class="mt-3"></div>
  <div class="text-end mt-3">
    <a href="/checkout.html" class="btn btn-success btn-lg" id="checkout-btn">Proceed to Checkout</a>
  </div>
</div>
<footer class="footer"><div class="container text-center"><p class="mb-0">&copy; 2025 ShopEase.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function load() {
  if (!requireAuth()) return;
  const items = await api.get('/api/cart');
  if (!items.length) {
    document.getElementById('cart').innerHTML = '<p class="text-muted">Your cart is empty.</p>';
    document.getElementById('checkout-btn').classList.add('d-none');
    return;
  }
  let subtotal = 0;
  const rows = items.map(i => {
    subtotal += +i.subtotal;
    return `<tr>
      <td><img src="${i.imageUrl || '/images/product-placeholder.svg'}" style="width:60px;height:60px;object-fit:cover" class="rounded me-2" alt="${i.productName}" onerror="this.src='/images/product-placeholder.svg'">${i.productName}</td>
      <td>${money(i.price)}</td>
      <td><input type="number" min="1" value="${i.quantity}" class="form-control form-control-sm qty" data-id="${i.id}" style="width:70px"></td>
      <td>${money(i.subtotal)}</td>
      <td><button class="btn btn-sm btn-outline-danger remove" data-id="${i.id}"><i class="bi bi-trash"></i></button></td>
    </tr>`;
  }).join('');
  document.getElementById('cart').innerHTML = `
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr><th colspan="3" class="text-end">Subtotal</th><th>${money(subtotal)}</th><th></th></tr>
        <tr><th colspan="3" class="text-end">Shipping</th><th>${money(subtotal >= 499 ? 0 : 49)}</th><th></th></tr>
        <tr><th colspan="3" class="text-end">Total</th><th>${money(subtotal + (subtotal >= 499 ? 0 : 49))}</th><th></th></tr>
      </tfoot>
    </table>
  </div>`;
  document.querySelectorAll('.qty').forEach(inp => {
    inp.onchange = async () => {
      try { await api.put('/api/cart/items/' + inp.dataset.id + '?quantity=' + inp.value, {}); load(); }
      catch(e){ showToast(e.message,'error'); }
    };
  });
  document.querySelectorAll('.remove').forEach(b => {
    b.onclick = async () => {
      try { await api.del('/api/cart/items/' + b.dataset.id); showToast('Removed'); load(); }
      catch(e){ showToast(e.message,'error'); }
    };
  });
}
load();
</script>
</body>
</html>
