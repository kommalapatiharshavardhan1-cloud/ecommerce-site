<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-bag-heart"></i> ShopEase</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" id="nav-cart" href="/cart.html">Cart</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><span class="nav-link d-none" id="nav-user"></span></li>
        <li class="nav-item"><a class="nav-link" id="nav-login" href="/login.html">Login</a></li>
        <li class="nav-item"><button class="btn btn-sm btn-outline-light ms-2 d-none" id="nav-logout">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container my-4">
  <h2>My Orders</h2>
  <div id="list" class="mt-3"></div>
</div>
<div class="modal fade" id="modal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Order Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="modalBody"></div>
</div></div></div>
<footer class="footer"><div class="container text-center"><p class="mb-0">&copy; 2025 ShopEase.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
const modal = new bootstrap.Modal(document.getElementById('modal'));
async function load() {
  if (!requireAuth()) return;
  const orders = await api.get('/api/orders');
  if (!orders.length) { document.getElementById('list').innerHTML = '<p class="text-muted">No orders yet.</p>'; return; }
  const statusBadge = s => {
    const m = {PENDING:'warning',CONFIRMED:'info',SHIPPED:'primary',DELIVERED:'success',CANCELLED:'danger'};
    return `<span class="badge text-bg-${m[s]||'secondary'}">${s}</span>`;
  };
  document.getElementById('list').innerHTML = `
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>#</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead>
      <tbody>${orders.map(o => `<tr>
        <td>${o.id}</td>
        <td>${new Date(o.createdAt).toLocaleString()}</td>
        <td>${statusBadge(o.status)}</td>
        <td>${money(o.totalAmount)}</td>
        <td><button class="btn btn-sm btn-outline-primary view" data-id="${o.id}">View</button></td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
  document.querySelectorAll('.view').forEach(b => b.onclick = async () => {
    const o = await api.get('/api/orders/' + b.dataset.id);
    document.getElementById('modalBody').innerHTML = `
      <p><strong>Status:</strong> ${statusBadge(o.status)}</p>
      <p><strong>Address:</strong> ${o.shippingAddress}</p>
      <p><strong>Phone:</strong> ${o.phone}</p>
      <table class="table"><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
      <tbody>${o.items.map(i=>`<tr><td>${i.productName}</td><td>${i.quantity}</td><td>${money(i.price)}</td><td>${money(i.subtotal)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><th colspan="3" class="text-end">Total</th><th>${money(o.totalAmount)}</th></tr></tfoot></table>`;
    modal.show();
  });
}
load();
</script>
</body>
</html>
